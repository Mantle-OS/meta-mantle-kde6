BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*/*.bb \
    ${LAYERDIR}/recipes-*/*.bbappend \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    ${LAYERDIR}/recipes-*/*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "kde6-rs6-layer"
BBFILE_PATTERN_kde6-rs6-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_kde6-rs6-layer = "10"

## FIXME 
LAYERDEPENDS_kde6-rs6-layer += " \
    openembedded-layer \
    kde6-layer \
    kf6-layer \
    qt6-layer \
"

LAYERSERIES_COMPAT_kde6-rs6-layer = "scarthgap"

#
KDE6_RS_VERSION ?= "25.08.0"
KDE6_RS_MIRROR ?= "${KDE6_MIRROR}/stable/release-service/${KDE6_RELEASE_SERVICE_VERSION}/srv"
