BBPATH .= ":${LAYERDIR}"
BBFILES += " \
    ${LAYERDIR}/recipes-*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*/*.bb \
    ${LAYERDIR}/recipes-*/*.bbappend \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    ${LAYERDIR}/recipes-*/*/*/*.bbappend \
"

LICENSE_PATH:append = "${LAYERDIR}/../licenses"

BBFILE_COLLECTIONS += "kde6-layer"
BBFILE_PATTERN_kde6-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_kde6-layer = "10"
LAYERDEPENDS_kde6-layer += " \
    openembedded-layer \
    kf6-layer \
    qt6-layer \
"
LAYERSERIES_COMPAT_kde6-layer = "scarthgap"


BBFILES_DYNAMIC += " \
    core:${LAYERDIR}/dynamic-layers/core/recipes*/*/*.bb \
    core:${LAYERDIR}/dynamic-layers/core/recipes*/*/*.bbappend \
"

KDE6_GIT ?= "git://invent.kde.org/"
KDE6_MIRROR ?= "http://download.kde.org"
KDE6_REUSE_LICENSECHECK_ENABLED ?= "0"
