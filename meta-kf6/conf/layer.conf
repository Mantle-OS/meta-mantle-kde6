BBPATH .= ":${LAYERDIR}"
BBFILES += " \
    ${LAYERDIR}/recipes-*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*.bbappend \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += " kf6-layer"
BBFILE_PATTERN_kf6-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_kf6-layer = "9"

LAYERSERIES_COMPAT_kf6-layer = "scarthgap"
LAYERDEPENDS_kf6-layer = " \
    core \
    yocto \
    networking-layer \
    meta-python \
    multimedia-layer \
    kde6-layer \
"

KDE6_KF6_VERSION ?= "6.17.0"
KDE6_KF6_VERSION_DIR ?= "6.17"
KDE6_KF6_MIRROR ?= "${KDE6_MIRROR}/stable/frameworks/${KDE6_KF6_VERSION_DIR}"
