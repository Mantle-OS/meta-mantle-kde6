BBPATH .= ":${LAYERDIR}"
BBFILES += " \
    ${LAYERDIR}/recipes-*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*/*.bb \
    ${LAYERDIR}/recipes-*/*.bbappend \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    ${LAYERDIR}/recipes-*/*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "kde6-plasma-layer"
BBFILE_PATTERN_kde6-plasma-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_kde6-plasma-layer = "10"

## FIXME 
LAYERDEPENDS_kde6-plasma-layer += " \
    openembedded-layer \
    kf6-layer \
    kde6-layer \
    qt6-layer \
"
LAYERSERIES_COMPAT_kde6-plasma-layer = "scarthgap"

KDE6_PLASMA_VERSION ?= "6.4.4"
KDE6_PLASMA_MIRROR ?= "${KDE6_MIRROR}/stable/plasma/${KDE6_PLASMA_VERSION}"
KDE6_PLASMA_WAYLAND_PROTOCOL="1.18.0"
